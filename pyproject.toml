[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sciowl-agent"
version = "0.1.0"
description = "Persistent scientific tool harness for SciOWL"
requires-python = ">=3.10"
dependencies = ["ase>=3.24,<4", "numpy>=1.24", "scipy>=1.10", "pydantic>=2.7,<3", "httpx>=0.27,<1", "langgraph>=0.2,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
mlip = ["mace-torch>=0.3.10,<0.4"]
tokenizer = ["transformers>=4.51,<5", "jinja2>=3.1,<4"]

[project.scripts]
sciowl-agent = "sciowl_agent.cli:main"

[tool.setuptools.packages.find]
include = ["sciowl_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

